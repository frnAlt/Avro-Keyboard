name: Build & Release Avro Keyboard

on:
  push:
    branches:
      - master
      - main
      - modernize-avro
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Execute Headless Compilation & Packaging
        shell: powershell
        run: |
          Write-Host "Triggering Avro Keyboard build pipeline..."
          .\build-release.ps1 -Configuration Release -Platform Win32

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Avro-Keyboard-Binaries
          path: |
            build/*.exe
            build/*.dll
            build/*.zip
            build/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
